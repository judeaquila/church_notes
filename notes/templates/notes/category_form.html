{% extends 'notes/base.html' %}

{% block title %}Edit Category - {{ category.name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 sm:p-8 rounded-xl border border-gray-200 shadow-sm space-y-5">
    <h1 class="text-xl font-bold text-gray-900">Edit Category</h1>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category Name</label>
            <input type="text" name="name" value="{{ category.name }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Badge Color</label>
            <input type="color" name="color" value="{{ category.color }}" class="h-10 w-20 p-1 border border-gray-300 rounded-lg cursor-pointer">
        </div>

        <div class="flex justify-end space-x-2 pt-2 border-t border-gray-100">
            <a href="{% url 'category_list' %}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Update Category</button>
        </div>
    </form>
</div>
{% endblock %}
